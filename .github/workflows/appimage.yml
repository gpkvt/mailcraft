name: AppImage (branch build)

on:
  push:
    branches:
      - fix/983-proton-mail
    paths:
      - ".github/workflows/appimage.yml"
      - "apps/**"
      - "crates/**"
      - "assets/**"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned toolchain action
        with:
          toolchain: 1.98.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev desktop-file-utils appstream zsync

      - name: Build AppImage
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: 0
          RUST_BACKTRACE: 1
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: packaging/linux/package.sh --formats appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mailcraft-appimage-x86_64
          path: |
            dist/release/*.AppImage
            dist/release/*.AppImage.zsync
          if-no-files-found: error
          retention-days: 14
